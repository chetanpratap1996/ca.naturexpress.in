<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 110" fill="none">
  <rect x="2" y="2" width="96" height="106" rx="16" fill="white" stroke="#e2e8f0" stroke-width="3" />
  <!-- 3 Red Vertical Pillars -->
  <rect x="10" y="8" width="24" height="78" rx="3" fill="#e52320" />
  <rect x="38" y="8" width="24" height="78" rx="3" fill="#e52320" />
  <rect x="66" y="8" width="24" height="78" rx="3" fill="#e52320" />
  <!-- Horizontal Black Pinstripes Across Pillars -->
  <rect x="10" y="34" width="80" height="3" fill="#18181b" />
  <rect x="10" y="40" width="80" height="3" fill="#18181b" />
  <rect x="10" y="46" width="80" height="3" fill="#18181b" />
  <!-- Bold Black Letters B, &, T -->
  <text x="22" y="72" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#18181b" text-anchor="middle">B</text>
  <text x="50" y="72" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="34" fill="#18181b" text-anchor="middle">&amp;</text>
  <text x="78" y="72" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="36" fill="#18181b" text-anchor="middle">T</text>
  <!-- BRAINS & TAXES in Red at bottom -->
  <text x="50" y="100" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="10" letter-spacing="2" fill="#e52320" text-anchor="middle">BRAINS &amp; TAXES</text>
</svg>
